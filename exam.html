
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحان علوم القرآن</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #f1f5f9;
      font-family: Tahoma, Arial, sans-serif;
      color: #172033;
    }
    .container {
      max-width: 600px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
    }
    h1 { text-align: center; color: #176b50; }
    .subtitle { text-align: center; color: #64748b; }
    input {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #176b50;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { opacity: .5; }
    .hidden { display: none; }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 15px 0;
      font-weight: bold;
    }
    .timer {
      color: #dc2626;
      font-size: 20px;
    }
    .question {
      font-size: 21px;
      line-height: 1.8;
      margin: 25px 0;
    }
    .option {
      display: block;
      width: 100%;
      text-align: right;
      background: #f1f5f9;
      color: #172033;
      border: 2px solid transparent;
      margin: 10px 0;
      line-height: 1.6;
    }
    .option.selected {
      border-color: #176b50;
      background: #dcfce7;
    }
    .message {
      text-align: center;
      margin-top: 15px;
      color: #dc2626;
    }
    .result {
      text-align: center;
      font-size: 22px;
      line-height: 2;
    }
  </style>
</head>
<body>

<div class="container">
  <section id="login">
    <h1>امتحان علوم القرآن</h1>
    <p class="subtitle">أدخل كود الطالب للبدء</p>
    <input id="studentCode" placeholder="كود الطالب" inputmode="numeric">
    <button id="startBtn" onclick="startExam()">دخول الامتحان</button>
    <p id="loginMessage" class="message"></p>
  </section>

  <section id="exam" class="hidden">
    <h1>امتحان علوم القرآن</h1>
    <div class="top">
      <span id="progress">السؤال 1 من 20</span>
      <span class="timer" id="timer">30 ثانية</span>
    </div>
    <div id="question" class="question"></div>
    <div id="options"></div>
    <button id="nextBtn" onclick="submitAnswer()" disabled>تأكيد الإجابة</button>
    <p id="examMessage" class="message"></p>
  </section>

  <section id="result" class="hidden">
    <h1>انتهى الامتحان</h1>
    <div class="result">
      <p>تم تسليم إجاباتك بنجاح.</p>
      <p id="score"></p>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://bouihbsnuuxqeityyrgl.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ug3xBkJESfI973ZpOeXLFA_wjPoExD-";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let attemptId = null;
let sessionToken = null;
let currentQuestion = null;
let selectedOption = null;
let secondsLeft = 30;
let timerInterval = null;
let submitting = false;

function show(id) {
  ["login", "exam", "result"].forEach(section => {
    document.getElementById(section).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

async function startExam() {
  const code = document.getElementById("studentCode").value.trim();
  const message = document.getElementById("loginMessage");
  const button = document.getElementById("startBtn");

  if (!code) {
    message.textContent = "اكتب كود الطالب أولًا";
    return;
  }

  button.disabled = true;
  message.textContent = "جاري التحقق من الكود...";

  try {
    const { data, error } = await db.rpc("start_exam", {
      p_code: code
    });

    if (error) throw error;

    const result = data;
    if (!result || !result.session_token || !result.attempt_id) {
      throw new Error("تعذر بدء الامتحان.");
    }

    attemptId = result.attempt_id;
    sessionToken = result.session_token;

    localStorage.setItem("exam_session_token", sessionToken);

    if (result.finished) {
      showResult(result.correct_count);
      return;
    }

    show("exam");
    displayQuestion(result.question, result.seconds_left);
  } catch (error) {
    message.textContent = error.message || "حدث خطأ أثناء الدخول";
  } finally {
    button.disabled = false;
  }
}

function displayQuestion(question, remaining = 30) {
  if (!question) {
    document.getElementById("examMessage").textContent =
      "لم يتم استلام السؤال من الخادم.";
    return;
  }

  currentQuestion = question;
  selectedOption = null;
  submitting = false;

  document.getElementById("progress").textContent =
    "السؤال " + question.number + " من 20";

  document.getElementById("question").textContent =
    question.question;

  const optionsBox = document.getElementById("options");
  optionsBox.innerHTML = "";

  question.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option;

    button.onclick = () => {
      if (submitting) return;
      selectedOption = index + 1;

      document.querySelectorAll(".option").forEach(item => {
        item.classList.remove("selected");
      });

      button.classList.add("selected");
      document.getElementById("nextBtn").disabled = false;
    };

    optionsBox.appendChild(button);
  });

  document.getElementById("nextBtn").disabled = true;
  document.getElementById("examMessage").textContent = "";

  startTimer(remaining);
}

function startTimer(seconds) {
  clearInterval(timerInterval);
  secondsLeft = Math.max(0, Math.ceil(seconds));

  updateTimer();

  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimer();

    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      submitAnswer(true);
    }
  }, 1000);
}

function updateTimer() {
  document.getElementById("timer").textContent =
    secondsLeft + " ثانية";
}

async function submitAnswer(timeout = false) {
  if (submitting || !currentQuestion) return;

  submitting = true;
  clearInterval(timerInterval);

  document.getElementById("nextBtn").disabled = true;
  document.getElementById("examMessage").textContent =
    "جاري حفظ الإجابة...";

  try {
    const { data, error } = await db.rpc("submit_exam_answer", {
      p_session_token: sessionToken,
      p_question_id: currentQuestion.id,
      p_selected_option: timeout ? null : selectedOption
    });

    if (error) throw error;

    if (!data) throw new Error("لم يتم استلام رد من الخادم.");

    if (data.finished) {
      localStorage.removeItem("exam_session_token");
      showResult(data.correct_count);
      return;
    }

    displayQuestion(data.question, data.seconds_left);
  } catch (error) {
    document.getElementById("examMessage").textContent =
      error.message || "تعذر حفظ الإجابة. حاول مرة أخرى.";
    submitting = false;
    document.getElementById("nextBtn").disabled =
      selectedOption === null && !timeout;
  }
}

function showResult(correctCount) {
  clearInterval(timerInterval);
  show("result");

  document.getElementById("score").textContent =
    "درجتك: " + correctCount + " من 20";
}
</script>

</body>
</html>
